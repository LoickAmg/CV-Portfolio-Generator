<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMG Generator — CV & Portfolio Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #080c10;
  --bg2:     #0d1117;
  --bg3:     #161b22;
  --bg4:     #1c2430;
  --accent:  #2d8cf0;
  --accent2: #58a6ff;
  --white:   #e8edf2;
  --muted:   #7d8590;
  --border:  rgba(255,255,255,0.08);
  --danger:  #f85149;
  --success: #3fb950;
  --font-h:  'Syne', sans-serif;
  --font-b:  'Outfit', sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{
  background:var(--bg); color:var(--white);
  font-family:var(--font-b); font-size:14px;
  height:100%; display:flex; flex-direction:column; overflow:hidden;
}

/* ── Header ────────────────────────────────────────── */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:.7rem 1.5rem;
  background:var(--bg2); border-bottom:1px solid var(--border);
  flex-shrink:0; gap:1rem; z-index:10;
}
.logo{font-family:var(--font-h);font-size:1.1rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
.logo span{color:var(--accent);}
.mode-toggle{display:flex;background:var(--bg3);border-radius:6px;padding:3px;gap:3px;}
.mode-btn{
  font-family:var(--font-h);font-size:.78rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:.35rem .9rem;border-radius:4px;border:none;cursor:pointer;
  background:transparent;color:var(--muted);transition:all .2s;
}
.mode-btn.active{background:var(--accent);color:#fff;}
.header-right{display:flex;align-items:center;gap:.75rem;}
.template-sel{
  background:var(--bg3);border:1px solid var(--border);color:var(--white);
  font-family:var(--font-b);font-size:.78rem;
  padding:.35rem .6rem;border-radius:5px;cursor:pointer;outline:none;
}
.template-sel option{background:var(--bg3);}
.btn-export{
  font-family:var(--font-h);font-size:.75rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:.38rem .9rem;border-radius:5px;border:none;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;gap:.4rem;
}
.btn-html{background:rgba(45,140,240,.15);color:var(--accent2);border:1px solid rgba(45,140,240,.3);}
.btn-html:hover{background:var(--accent);color:#fff;}
.btn-pdf{background:rgba(63,185,80,.12);color:var(--success);border:1px solid rgba(63,185,80,.3);}
.btn-pdf:hover{background:var(--success);color:#fff;}

/* ── Body ──────────────────────────────────────────── */
.app-body{display:flex;flex:1;overflow:hidden;}

/* ── Form Panel ────────────────────────────────────── */
.form-panel{
  width:340px;min-width:280px;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  flex-shrink:0;
}
.form-scroll{flex:1;overflow-y:auto;padding:.75rem;}
.form-scroll::-webkit-scrollbar{width:4px;}
.form-scroll::-webkit-scrollbar-track{background:transparent;}
.form-scroll::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px;}

/* Sections accordion */
.section{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;margin-bottom:.5rem;overflow:hidden;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:.55rem .75rem;cursor:pointer;user-select:none;
  gap:.5rem;
}
.section-head:hover{background:var(--bg4);}
.section-title{
  font-family:var(--font-h);font-size:.75rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);
  display:flex;align-items:center;gap:.5rem;
}
.section-icon{font-size:.95rem;}
.section-arrow{font-size:.7rem;color:var(--muted);transition:transform .2s;}
.section.open .section-arrow{transform:rotate(180deg);}
.section-body{display:none;padding:.6rem .75rem .75rem;}
.section.open .section-body{display:block;}

/* Form fields */
.field{margin-bottom:.6rem;}
.field label{
  display:block;font-size:.72rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.25rem;
}
.field input,.field textarea,.field select{
  width:100%;background:var(--bg4);border:1px solid var(--border);
  color:var(--white);font-family:var(--font-b);font-size:.85rem;
  padding:.4rem .6rem;border-radius:5px;outline:none;
  transition:border-color .2s;
}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:70px;line-height:1.5;}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}

/* Skill rows */
.skill-row{
  display:grid;grid-template-columns:1fr auto 28px;align-items:center;
  gap:.4rem;margin-bottom:.4rem;
}
.skill-row input{background:var(--bg4)!important;}
.skill-level{
  width:70px;background:var(--bg4);border:1px solid var(--border);
  color:var(--accent2);font-size:.8rem;text-align:center;
  padding:.35rem .4rem;border-radius:5px;outline:none;font-family:var(--font-b);
}
.btn-rm{
  width:26px;height:26px;border:none;border-radius:4px;cursor:pointer;
  background:rgba(248,81,73,.12);color:var(--danger);font-size:.9rem;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
  flex-shrink:0;
}
.btn-rm:hover{background:var(--danger);color:#fff;}
.btn-add{
  display:flex;align-items:center;gap:.35rem;
  font-size:.75rem;font-weight:600;color:var(--accent);
  background:transparent;border:1px dashed rgba(45,140,240,.3);
  border-radius:5px;padding:.3rem .6rem;cursor:pointer;
  transition:all .2s;width:100%;justify-content:center;margin-top:.3rem;
}
.btn-add:hover{background:rgba(45,140,240,.1);border-color:var(--accent);}

/* Exp / Edu items */
.dyn-item{
  background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:.55rem .6rem;margin-bottom:.5rem;
  position:relative;
}
.dyn-item-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:.5rem;
}
.dyn-item-label{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
.dyn-item .field{margin-bottom:.4rem;}
.dyn-item .field:last-child{margin-bottom:0;}

/* Tags input */
.tags-wrap{
  display:flex;flex-wrap:wrap;gap:.3rem;
  background:var(--bg4);border:1px solid var(--border);
  border-radius:5px;padding:.35rem .5rem;min-height:36px;cursor:text;
  align-items:center;
}
.tags-wrap:focus-within{border-color:var(--accent);}
.tag{
  font-size:.75rem;padding:.15rem .45rem;background:rgba(45,140,240,.15);
  border:1px solid rgba(45,140,240,.25);color:var(--accent2);border-radius:3px;
  display:flex;align-items:center;gap:.25rem;cursor:default;
}
.tag-x{cursor:pointer;opacity:.6;font-size:.85em;}
.tag-x:hover{opacity:1;}
.tags-input{
  background:transparent;border:none;outline:none;color:var(--white);
  font-family:var(--font-b);font-size:.82rem;
  flex:1;min-width:80px;
}
.tags-hint{font-size:.67rem;color:var(--muted);margin-top:.2rem;}

/* ── Preview Panel ──────────────────────────────────── */
.preview-panel{
  flex:1;display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden;
}
.preview-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.4rem 1rem;background:var(--bg2);
  border-bottom:1px solid var(--border);flex-shrink:0;
  gap:.5rem;
}
.preview-label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.preview-wrap{
  flex:1;overflow:auto;display:flex;
  align-items:flex-start;justify-content:center;
  padding:1.5rem;background:var(--bg);
}
.preview-wrap::-webkit-scrollbar{width:6px;height:6px;}
.preview-wrap::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
#preview{
  border:none;background:#fff;
  box-shadow:0 4px 40px rgba(0,0,0,.5);
  border-radius:4px;
}

/* ── Utils ──────────────────────────────────────────── */
.hidden{display:none!important;}
.divider{height:1px;background:var(--border);margin:.5rem 0;}
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────── -->
<header>
  <div class="logo">AMG <span>Generator</span></div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-cv" onclick="setMode('cv')">CV</button>
    <button class="mode-btn" id="btn-portfolio" onclick="setMode('portfolio')">Portfolio</button>
  </div>
  <div class="header-right">
    <select class="template-sel" id="template-sel" onchange="updateTemplate()">
      <option value="amg-classic">AMG Classic (sombre)</option>
      <option value="light-pro">Light Pro (clair)</option>
    </select>
    <button class="btn-export btn-html" onclick="exportHTML()">⬇ HTML</button>
    <button class="btn-export btn-pdf" onclick="exportPDF()">🖨 PDF</button>
  </div>
</header>

<!-- ── APP BODY ───────────────────────────────────── -->
<div class="app-body">

  <!-- FORM PANEL -->
  <div class="form-panel">
    <div class="form-scroll" id="form-root">
      <!-- Rendered dynamically by JS -->
    </div>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="preview-panel">
    <div class="preview-toolbar">
      <span class="preview-label">Aperçu en direct</span>
      <span class="preview-label" id="preview-size"></span>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <iframe id="preview" title="Aperçu"></iframe>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let mode = 'cv';
let cvTemplate = 'amg-classic';
let portfolioTemplate = 'amg-dark';

const cv = {
  name: 'AMOUSSOU-GUENOU Loïc Junior Mahouna',
  title: 'Développeur Web & IA · Monteur Vidéo',
  location: 'Cotonou, Bénin',
  phone: '+229 01 94 60 92 69',
  email: 'mahounaamg@gmail.com',
  github: 'github.com/loic-amg',
  linkedin: '',
  profile: "Développeur Web & IA en Master 2 à l'ESGIS Bénin, avec 3 stages en entreprises ESN et agences publiques. Passionné par l'intelligence artificielle embarquée, l'automatisation et la création de contenu vidéo. Autonome, curieux et capable de monter rapidement en compétences sur de nouvelles technologies.",
  devSkills: [
    {name:'Python', level:85},
    {name:'Node.js', level:72},
    {name:'AngularJS', level:68},
    {name:'Rust', level:60},
    {name:'Spring Boot / Java', level:55},
  ],
  tools: ['PHP','SQL','Linux','Conda','WordPress','JSDoc','CKAN'],

    {name:'Photoshop', level:65},
  ],

    {name:'Anglais', level:'Débutant'},
  ],
  softSkills: ['Fiable & Responsable','Esprit d\'équipe','Autonome & Polyvalent'],
  interests: 'Cybersécurité · LLM locaux · Web design · Lecture · Musique · Jeux vidéo',
  experiences: [
    {title:'Stagiaire Développeur Junior', company:'PERO-GROUPE (ESN)', date:'Janv. – Avr. 2025',
     bullets:"Intégration de composants AngularJS sur le projet Forseti\nDocumentation technique Front-End avec JSDoc\nPersonnalisation de thèmes WordPress & gestion d'API REST"},
    {title:'Stagiaire Développeur Junior', company:'METEO-Bénin', date:'Sept. – Oct. 2024',
     bullets:"Apprentissage Python appliqué à la gestion de données climatiques\nConception de scripts d'automatisation sous Excel"},
    {title:'Stagiaire Développeur Junior', company:'PERO-GROUPE (ESN)', date:'Mars – Juil. 2024',
     bullets:"Apprentissage AngularJS & Spring Boot\nGestion de rapports qualitatifs sur SINEB\nInstallation de CKAN sur serveur Linux"},
  ],
  education: [
    {degree:'Master 2 Intelligence Artificielle', school:'ESGIS Bénin', year:'EN COURS'},
    {degree:'Master 1 Intelligence Artificielle', school:'ESGIS Bénin', year:'OBTENU'},
    {degree:'Licence Architecture Logicielle', school:'ESGIS Bénin', year:'2024'},
    {degree:'Baccalauréat Scientifique', school:'Lycée', year:'2021'},
  ],
};

const portfolio = {
  name: 'Loïc AMG',
  title: 'Développeur Web & IA · Monteur Vidéo',
  email: 'mahounaamg@gmail.com',
  github: 'github.com/loic-amg',
  linkedin: '',
  bio: "Passionné par l'intelligence artificielle, le développement web et la création de contenu vidéo. Actuellement en Master 2 IA à l'ESGIS Bénin.",
  skills: ['Python','Node.js','AngularJS','Rust','Java','PHP','SQL','Linux','Premiere Pro','After Effects'],
  projects: [
    {title:'Assistant ARK', category:'dev', description:"Assistant personnel IA à architecture souveraine et offline-first. Orchestrateur en Rust, backend Ollama, pipeline RAG/GraphRAG.", tech:'Rust, Python, Ollama, Node.js', link:''},
    {title:'Détection criminelle par IA', category:'dev', description:"Protocole de recherche M2 — utilisation des modèles d'IA pour la détection de schémas criminels au Bénin.", tech:'Python, ML, NLP', link:''},
    {title:'Plateforme SINEB', category:'dev', description:"Gestion de rapports qualitatifs et déploiement CKAN sur Linux lors du stage PERO-GROUPE.", tech:'AngularJS, Spring Boot, Linux', link:''},
    {title:'Montage & Reels', category:'video', description:"Création de contenus vidéo courts avec motion design et effets cinématiques.", tech:'Premiere Pro, After Effects', link:''},
    {title:'Identité visuelle & Retouche', category:'video', description:"Design d'identités visuelles et retouche photo pour projets personnels et professionnels.", tech:'Photoshop, Design', link:''},
  ],
};

/* ══════════════════════════════════════════════════
   FORM RENDERING
══════════════════════════════════════════════════ */
function sec(icon, title, id, content) {
  return `<div class="section open" id="sec-${id}">
    <div class="section-head" onclick="toggleSec('${id}')">
      <div class="section-title"><span class="section-icon">${icon}</span>${title}</div>
      <span class="section-arrow">▾</span>
    </div>
    <div class="section-body">${content}</div>
  </div>`;
}

function field(label, inputHtml) {
  return `<div class="field"><label>${label}</label>${inputHtml}</div>`;
}
function inp(key, ph, obj='cv') {
  return `<input type="text" placeholder="${ph}" value="${esc((obj==='cv'?cv:portfolio)[key]||'')}" oninput="${obj}['${key}']=this.value;updatePreview()">`;
}
function ta(key, ph, obj='cv') {
  return `<textarea placeholder="${ph}" oninput="${obj}['${key}']=this.value;updatePreview()">${esc((obj==='cv'?cv:portfolio)[key]||'')}</textarea>`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderSkillRows(arr, arrKey, addFn, obj='cv') {
  return arr.map((s,i)=>`
    <div class="skill-row">
      <input type="text" class="field input" placeholder="Compétence" value="${esc(s.name)}"
        oninput="${obj}['${arrKey}'][${i}].name=this.value;updatePreview()">
      <input type="number" class="skill-level" min="0" max="100" value="${s.level}"
        oninput="${obj}['${arrKey}'][${i}].level=+this.value;updatePreview()">
      <button class="btn-rm" onclick="${obj}['${arrKey}'].splice(${i},1);renderForm();updatePreview()">✕</button>
    </div>`).join('')
  + `<button class="btn-add" onclick="${addFn};renderForm();updatePreview()">+ Ajouter</button>`;
}

function renderTagsInput(arrKey, obj='cv') {
  const arr = (obj==='cv'?cv:portfolio)[arrKey];
  const tags = arr.map((t,i)=>
    `<span class="tag">${esc(t)}<span class="tag-x" onclick="rmTag('${arrKey}',${i},'${obj}')">✕</span></span>`
  ).join('');
  return `<div class="tags-wrap" onclick="this.querySelector('.tags-input').focus()">
    ${tags}
    <input class="tags-input" type="text" placeholder="Ajouter…" onkeydown="addTag(event,'${arrKey}','${obj}')">
  </div><div class="tags-hint">Appuyer Entrée ou virgule pour ajouter</div>`;
}

function renderExpItems() {
  return cv.experiences.map((e,i)=>`
    <div class="dyn-item">
      <div class="dyn-item-head">
        <span class="dyn-item-label">Expérience ${i+1}</span>
        <button class="btn-rm" onclick="cv.experiences.splice(${i},1);renderForm();updatePreview()">✕</button>
      </div>
      ${field('Titre du poste',`<input type="text" value="${esc(e.title)}" oninput="cv.experiences[${i}].title=this.value;updatePreview()">`)}
      ${field('Entreprise',`<input type="text" value="${esc(e.company)}" oninput="cv.experiences[${i}].company=this.value;updatePreview()">`)}
      ${field('Période',`<input type="text" value="${esc(e.date)}" oninput="cv.experiences[${i}].date=this.value;updatePreview()">`)}
      ${field('Missions (une par ligne)',`<textarea oninput="cv.experiences[${i}].bullets=this.value;updatePreview()">${esc(e.bullets)}</textarea>`)}
    </div>`).join('')
  + `<button class="btn-add" onclick="cv.experiences.push({title:'',company:'',date:'',bullets:''});renderForm();updatePreview()">+ Ajouter une expérience</button>`;
}

function renderEduItems() {
  return cv.education.map((e,i)=>`
    <div class="dyn-item">
      <div class="dyn-item-head">
        <span class="dyn-item-label">Formation ${i+1}</span>
        <button class="btn-rm" onclick="cv.education.splice(${i},1);renderForm();updatePreview()">✕</button>
      </div>
      ${field('Diplôme / Formation',`<input type="text" value="${esc(e.degree)}" oninput="cv.education[${i}].degree=this.value;updatePreview()">`)}
      <div class="field-row">
        ${field('École',`<input type="text" value="${esc(e.school)}" oninput="cv.education[${i}].school=this.value;updatePreview()">`)}
        ${field('Année',`<input type="text" value="${esc(e.year)}" oninput="cv.education[${i}].year=this.value;updatePreview()">`)}
      </div>
    </div>`).join('')
  + `<button class="btn-add" onclick="cv.education.push({degree:'',school:'',year:''});renderForm();updatePreview()">+ Ajouter une formation</button>`;
}

function renderLangItems() {
  return cv.languages.map((l,i)=>`
    <div class="field-row" style="margin-bottom:.35rem">
      <input type="text" placeholder="Langue" value="${esc(l.name)}" oninput="cv.languages[${i}].name=this.value;updatePreview()">
      <input type="text" placeholder="Niveau" value="${esc(l.level)}" oninput="cv.languages[${i}].level=this.value;updatePreview()">
      <button class="btn-rm" onclick="cv.languages.splice(${i},1);renderForm();updatePreview()" style="width:26px;height:auto">✕</button>
    </div>`).join('')
  + `<button class="btn-add" onclick="cv.languages.push({name:'',level:''});renderForm();updatePreview()">+ Ajouter</button>`;
}

function renderProjectItems() {
  return portfolio.projects.map((p,i)=>`
    <div class="dyn-item">
      <div class="dyn-item-head">
        <span class="dyn-item-label">Projet ${i+1}</span>
        <button class="btn-rm" onclick="portfolio.projects.splice(${i},1);renderForm();updatePreview()">✕</button>
      </div>
      ${field('Titre',`<input type="text" value="${esc(p.title)}" oninput="portfolio.projects[${i}].title=this.value;updatePreview()">`)}
      <div class="field-row">
        ${field('Catégorie',`<input type="text" value="${esc(p.category)}" placeholder="dev / video / design" oninput="portfolio.projects[${i}].category=this.value;updatePreview()">`)}
        ${field('Lien',`<input type="text" value="${esc(p.link)}" placeholder="https://..." oninput="portfolio.projects[${i}].link=this.value;updatePreview()">`)}
      </div>
      ${field('Description',`<textarea oninput="portfolio.projects[${i}].description=this.value;updatePreview()">${esc(p.description)}</textarea>`)}
      ${field('Technologies (virgules)',`<input type="text" value="${esc(p.tech)}" oninput="portfolio.projects[${i}].tech=this.value;updatePreview()">`)}
    </div>`).join('')
  + `<button class="btn-add" onclick="portfolio.projects.push({title:'',category:'dev',description:'',tech:'',link:''});renderForm();updatePreview()">+ Ajouter un projet</button>`;
}

function renderForm() {
  const root = document.getElementById('form-root');
  if (mode === 'cv') {
    root.innerHTML = [
      sec('👤','Identité','identity',`
        ${field('Nom complet',inp('name','Jean Dupont'))}
        ${field('Titre / Poste',inp('title','Développeur Web & IA'))}
        <div class="field-row">
          ${field('Localisation',inp('location','Cotonou, Bénin'))}
          ${field('Téléphone',inp('phone','+229...'))}
        </div>
        ${field('Email',inp('email','email@exemple.com'))}
        <div class="field-row">
          ${field('GitHub',inp('github','github.com/username'))}
          ${field('LinkedIn',inp('linkedin','linkedin.com/in/...'))}
        </div>
      `),
      sec('📝','Profil','profile', field('Résumé professionnel',ta('profile','Décrivez votre profil…'))),
      sec('💻','Compétences Dev & IA','devskills', renderSkillRows(cv.devSkills,'devSkills',"cv.devSkills.push({name:'',level:70})")),
      sec('🔧','Outils','tools',`
        ${field('Tags outils', renderTagsInput('tools','cv'))}
      `),
      sec('🎬','Compétences Vidéo','videoskills', renderSkillRows(cv.videoSkills,'videoSkills',"cv.videoSkills.push({name:'',level:70})")),
      sec('💼','Expériences','experiences', renderExpItems()),
      sec('🎓','Formation','education', renderEduItems()),
      sec('🌐','Langues','languages', renderLangItems()),
      sec('✨','Qualités & Intérêts','soft',`
        ${field('Soft skills (tags)',renderTagsInput('softSkills','cv'))}
        ${field('Intérêts',`<input type="text" value="${esc(cv.interests)}" placeholder="Lecture, Musique…" oninput="cv.interests=this.value;updatePreview()">`)}
      `),
    ].join('');
  } else {
    root.innerHTML = [
      sec('👤','Identité','pf-identity',`
        ${field('Nom / Pseudonyme',`<input type="text" value="${esc(portfolio.name)}" oninput="portfolio.name=this.value;updatePreview()">`)}
        ${field('Titre / Tagline',`<input type="text" value="${esc(portfolio.title)}" oninput="portfolio.title=this.value;updatePreview()">`)}
        ${field('Email',`<input type="text" value="${esc(portfolio.email)}" oninput="portfolio.email=this.value;updatePreview()">`)}
        <div class="field-row">
          ${field('GitHub',`<input type="text" value="${esc(portfolio.github)}" oninput="portfolio.github=this.value;updatePreview()">`)}
          ${field('LinkedIn',`<input type="text" value="${esc(portfolio.linkedin)}" oninput="portfolio.linkedin=this.value;updatePreview()">`)}
        </div>
      `),
      sec('📝','Bio','pf-bio', field('À propos',`<textarea oninput="portfolio.bio=this.value;updatePreview()">${esc(portfolio.bio)}</textarea>`)),
      sec('🛠','Compétences','pf-skills', field('Tags skills',renderTagsInput('skills','portfolio'))),

    ].join('');
  }
}

/* ══════════════════════════════════════════════════
   TAG HELPERS
══════════════════════════════════════════════════ */
function addTag(e, key, obj='cv') {
  if(e.key==='Enter'||e.key===',') {
    e.preventDefault();
    const v = e.target.value.trim().replace(/,$/,'');
    if(v){(obj==='cv'?cv:portfolio)[key].push(v); e.target.value=''; renderForm(); updatePreview();}
  }
}
function rmTag(key, i, obj='cv') {
  (obj==='cv'?cv:portfolio)[key].splice(i,1); renderForm(); updatePreview();
}

/* ══════════════════════════════════════════════════
   TOGGLE SECTION
══════════════════════════════════════════════════ */
function toggleSec(id) {
  document.getElementById('sec-'+id).classList.toggle('open');
}

/* ══════════════════════════════════════════════════
   MODE & TEMPLATE
══════════════════════════════════════════════════ */
function setMode(m) {
  mode = m;
  document.getElementById('btn-cv').classList.toggle('active', m==='cv');
  document.getElementById('btn-portfolio').classList.toggle('active', m==='portfolio');
  const sel = document.getElementById('template-sel');
  if(m==='cv'){
    sel.innerHTML='<option value="amg-classic">AMG Classic (sombre)</option><option value="light-pro">Light Pro (clair)</option>';
    sel.value = cvTemplate;
  } else {
    sel.innerHTML='<option value="amg-dark">AMG Dark (cinématique)</option><option value="minimal">Minimal (clair)</option>';
    sel.value = portfolioTemplate;
  }
  renderForm();
  updatePreview();
}
function updateTemplate() {
  const v = document.getElementById('template-sel').value;
  if(mode==='cv') cvTemplate=v; else portfolioTemplate=v;
  updatePreview();
}

/* ══════════════════════════════════════════════════
   PREVIEW
══════════════════════════════════════════════════ */
let previewTimer = null;
function updatePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(_doPreview, 80);
}

function _doPreview() {
  const iframe = document.getElementById('preview');
  const html = mode==='cv' ? renderCVTemplate() : renderPortfolioTemplate();
  if (mode==='cv') {
    iframe.style.width='210mm'; iframe.style.height='297mm';
    document.getElementById('preview-size').textContent='A4 · 210×297mm';
  } else {
    iframe.style.width='900px'; iframe.style.height='600px';
    document.getElementById('preview-size').textContent='Web · 900px';
  }
  iframe.srcdoc = html;
}

/* ══════════════════════════════════════════════════
   EXPORT
══════════════════════════════════════════════════ */
function exportHTML() {
  const html = mode==='cv' ? renderCVTemplate() : renderPortfolioTemplate();
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = mode==='cv' ? 'cv.html' : 'portfolio.html';
  a.click();
}

function exportPDF() {
  const html = mode==='cv' ? renderCVTemplate() : renderPortfolioTemplate();
  const win = window.open('','_blank');
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(()=>{ win.print(); }, 800);
}
