<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV & Portfolio Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Montserrat:wght@300;400;600;700&family=Bebas+Neue&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #080c10;
  --bg2:     #0d1117;
  --bg3:     #161b22;
  --bg4:     #1c2430;
  --accent:  #2d8cf0;
  --accent2: #58a6ff;
  --white:   #e8edf2;
  --muted:   #7d8590;
  --border:  rgba(255,255,255,0.08);
  --danger:  #f85149;
  --success: #3fb950;
  --font-h:  'Syne', sans-serif;
  --font-b:  'Outfit', sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{
  background:var(--bg); color:var(--white);
  font-family:var(--font-b); font-size:14px;
  height:100%; display:flex; flex-direction:column; overflow:hidden;
}

/* ── Header ────────────────────────────────────────── */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:.7rem 1.5rem;
  background:var(--bg2); border-bottom:1px solid var(--border);
  flex-shrink:0; gap:1rem; z-index:10;
}
.logo{font-family:var(--font-h);font-size:1.1rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
.logo span{color:var(--accent);}
.mode-toggle{display:flex;background:var(--bg3);border-radius:6px;padding:3px;gap:3px;}
.mode-btn{
  font-family:var(--font-h);font-size:.78rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:.35rem .9rem;border-radius:4px;border:none;cursor:pointer;
  background:transparent;color:var(--muted);transition:all .2s;
}
.mode-btn.active{background:var(--accent);color:#fff;}
.header-right{display:flex;align-items:center;gap:.75rem;}
.template-sel{
  background:var(--bg3);border:1px solid var(--border);color:var(--white);
  font-family:var(--font-b);font-size:.78rem;
  padding:.35rem .6rem;border-radius:5px;cursor:pointer;outline:none;
}
.template-sel option{background:var(--bg3);}
.btn-export{
  font-family:var(--font-h);font-size:.75rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:.38rem .9rem;border-radius:5px;border:none;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;gap:.4rem;
}
.btn-html{background:rgba(45,140,240,.15);color:var(--accent2);border:1px solid rgba(45,140,240,.3);}
.btn-html:hover{background:var(--accent);color:#fff;}
.btn-pdf{background:rgba(63,185,80,.12);color:var(--success);border:1px solid rgba(63,185,80,.3);}
.btn-pdf:hover{background:var(--success);color:#fff;}

/* ── Body ──────────────────────────────────────────── */
.app-body{display:flex;flex:1;overflow:hidden;}

/* ── Form Panel ────────────────────────────────────── */
.form-panel{
  width:360px;min-width:300px;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  flex-shrink:0;
}
.form-scroll{flex:1;overflow-y:auto;padding:.75rem;}
.form-scroll::-webkit-scrollbar{width:4px;}
.form-scroll::-webkit-scrollbar-track{background:transparent;}
.form-scroll::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px;}

/* Sections accordion */
.section{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;margin-bottom:.5rem;overflow:hidden;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:.55rem .75rem;cursor:pointer;user-select:none;
  gap:.5rem;
}
.section-head:hover{background:var(--bg4);}
.section-title{
  font-family:var(--font-h);font-size:.75rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);
  display:flex;align-items:center;gap:.5rem;
}
.section-icon{font-size:.95rem;}
.section-arrow{font-size:.7rem;color:var(--muted);transition:transform .2s;}
.section.open .section-arrow{transform:rotate(180deg);}
.section-body{display:none;padding:.6rem .75rem .75rem;}
.section.open .section-body{display:block;}

/* Form fields */
.field{margin-bottom:.6rem;}
.field label{
  display:block;font-size:.72rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.25rem;
}
.field input,.field textarea,.field select{
  width:100%;background:var(--bg4);border:1px solid var(--border);
  color:var(--white);font-family:var(--font-b);font-size:.85rem;
  padding:.4rem .6rem;border-radius:5px;outline:none;
  transition:border-color .2s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:70px;line-height:1.5;}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}

/* Skill rows */
.skill-row{
  display:grid;grid-template-columns:1fr auto 28px;align-items:center;
  gap:.4rem;margin-bottom:.4rem;
}
.skill-row input{background:var(--bg4)!important;}
.skill-level{
  width:70px;background:var(--bg4);border:1px solid var(--border);
  color:var(--accent2);font-size:.8rem;text-align:center;
  padding:.35rem .4rem;border-radius:5px;outline:none;font-family:var(--font-b);
}
.btn-rm{
  width:26px;height:26px;border:none;border-radius:4px;cursor:pointer;
  background:rgba(248,81,73,.12);color:var(--danger);font-size:.9rem;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
  flex-shrink:0;
}
.btn-rm:hover{background:var(--danger);color:#fff;}
.btn-add{
  display:flex;align-items:center;gap:.35rem;
  font-size:.75rem;font-weight:600;color:var(--accent);
  background:transparent;border:1px dashed rgba(45,140,240,.3);
  border-radius:5px;padding:.3rem .6rem;cursor:pointer;
  transition:all .2s;width:100%;justify-content:center;margin-top:.3rem;
}
.btn-add:hover{background:rgba(45,140,240,.1);border-color:var(--accent);}

/* Exp / Edu items */
.dyn-item{
  background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:.55rem .6rem;margin-bottom:.5rem;
  position:relative;
}
.dyn-item-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:.5rem;
}
.dyn-item-label{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
.dyn-item .field{margin-bottom:.4rem;}
.dyn-item .field:last-child{margin-bottom:0;}

/* Tags input */
.tags-wrap{
  display:flex;flex-wrap:wrap;gap:.3rem;
  background:var(--bg4);border:1px solid var(--border);
  border-radius:5px;padding:.35rem .5rem;min-height:36px;cursor:text;
  align-items:center;
}
.tags-wrap:focus-within{border-color:var(--accent);}
.tag{
  font-size:.75rem;padding:.15rem .45rem;background:rgba(45,140,240,.15);
  border:1px solid rgba(45,140,240,.25);color:var(--accent2);border-radius:3px;
  display:flex;align-items:center;gap:.25rem;cursor:default;
}
.tag-x{cursor:pointer;opacity:.6;font-size:.85em;}
.tag-x:hover{opacity:1;}
.tags-input{
  background:transparent;border:none;outline:none;color:var(--white);
  font-family:var(--font-b);font-size:.82rem;
  flex:1;min-width:80px;
}
.tags-hint{font-size:.67rem;color:var(--muted);margin-top:.2rem;}

/* ── Preview Panel ──────────────────────────────────── */
.preview-panel{
  flex:1;display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden;
}
.preview-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.4rem 1rem;background:var(--bg2);
  border-bottom:1px solid var(--border);flex-shrink:0;
  gap:.5rem;
}
.preview-label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.preview-wrap{
  flex:1;overflow:auto;display:flex;
  align-items:flex-start;justify-content:center;
  padding:1.5rem;background:var(--bg);
}
.preview-wrap::-webkit-scrollbar{width:6px;height:6px;}
.preview-wrap::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
#preview{
  border:none;background:#fff;
  box-shadow:0 4px 40px rgba(0,0,0,.5);
  border-radius:4px;
}

/* ── Utils ──────────────────────────────────────────── */
.hidden{display:none!important;}
.divider{height:1px;background:var(--border);margin:.5rem 0;}
</style>
</head>
<body>

<header>
  <div class="logo">CV & Portfolio <span>Generator</span></div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-cv" onclick="setMode('cv')">CV</button>
    <button class="mode-btn" id="btn-portfolio" onclick="setMode('portfolio')">Portfolio</button>
  </div>
  <div class="header-right">
    <select class="template-sel" id="template-sel" onchange="updateTemplate()">
      </select>
    <button class="btn-export btn-html" onclick="exportHTML()">⬇ HTML</button>
    <button class="btn-export btn-pdf" onclick="exportPDF()">🖨 PDF</button>
  </div>
</header>

<div class="app-body">
  <div class="form-panel">
    <div class="form-scroll" id="form-root">
      </div>
  </div>

  <div class="preview-panel">
    <div class="preview-toolbar">
      <span class="preview-label">Aperçu en direct</span>
      <span class="preview-label" id="preview-size"></span>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <iframe id="preview" title="Aperçu"></iframe>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   PROFILS ALÉATOIRES (ZÉRO DONNÉE PERSO PAR DÉFAUT)
══════════════════════════════════════════════════ */
const mockProfiles = [
  {

      devSkills: [{name:'HTML5 / CSS3', level:90}, {name:'JavaScript (ES6)', level:80}, {name:'React.js', level:75}, {name:'Tailwind CSS', level:85}],

        {title:'Product Designer Senior', company:'Pixel Craft Studio', date:'2024 - Présent', bullets:'Refonte complète de l\'application SaaS interne ayant augmenté la conversion de 22%\nCréation et maintenance d\'un Design System complet partagé entre designers et développeurs\nAnimation d\'ateliers de co-conception avec les clients clés'},
        {title:'Designer UX/UI & Intégrateur', company:'Agence Web Horizon', date:'2022 - 2024', bullets:'Conception d\'interfaces e-commerce adaptatives pour plus de 15 clients\nIntégration pixel-perfect des maquettes validées sous des architectures modulaires'}
      ],
      education: [{degree:'Master Direction Artistique Numérique', school:'Gobelins Paris', year:'2022'}, {degree:'Licence Design Graphique', school:'Université de Lyon', year:'2020'}]
    },
    portfolio: {
      name: 'Thomas M.', title: 'UX/UI Designer & Créatif Numérique', email: 'thomas.marechal@example.com', github: 'github.com/thomasm-design', linkedin: 'linkedin.com/in/thomasmarechal',
      bio: "Créateur d'identités numériques raffinées et d'interfaces intuitives. Je transforme des problématiques complexes en solutions visuelles fluides.",
      skills: ['Figma', 'UX Research', 'UI Design', 'HTML/CSS', 'Tailwind', 'React', 'After Effects', 'Motion Design'],
      projects: [
        {title:'SaaS FinTech - Nova', category:'dev', description:'Conception globale de l\'application de gestion de portefeuille crypto et intégration de la console.', tech:'Figma, React, Tailwind', link:'#'},
        {title:'Refonte E-Commerce Craft', category:'design', description:'Maquettes et prototypage haute fidélité pour une marque de mobilier éco-responsable.', tech:'Figma, Notion', link:'#'},
        {title:'Identité & Loop Animée', category:'video', description:'Création de la charte graphique globale et générique de marque en Motion Design.', tech:'After Effects, Illustrator', link:'#'}
      ]
    }
  },
  {
    cv: {
      name: 'Sophie Alami', title: 'Ingénieure Data Science & Solutions IA', location: 'Toulouse, France', phone: '+33 7 98 76 54 32', email: 'sophie.alami@example.ai', github: 'github.com/sophie-alami-ds', linkedin: 'linkedin.com/in/sophiealami',
      profile: "Spécialiste en apprentissage automatique et ingénierie des données, diplômée en Intelligence Artificielle. Forte d'une expertise éprouvée dans le développement d'architectures de modèles de langage (LLM) locaux et la mise en place de pipelines de traitement de données de grande envergure (Big Data).",
      devSkills: [{name:'Python (Scikit-Learn, PyTorch)', level:92}, {name:'SQL & NoSQL', level:85}, {name:'Docker / Kubernetes', level:70}, {name:'Apache Spark', level:65}],
      tools: ['Linux', 'Git', 'Jupyter', 'Mlflow', 'AWS', 'Hadoop'],
      videoSkills: [{name:'Photoshop (Visualisation)', level:50}],
      languages: [{name:'Français', level:'Maternelle'}, {name:'Anglais', level:'Bilingue (TOEIC 980)'}],
      softSkills: ['Esprit d\'analyse', 'Résolution de problèmes complexes', 'Autonomie'],

        {title:'Stagiaire Recherche Machine Learning', company:'Lab IA National', date:'2023 (6 mois)', bullets:'Analyse et traitement de jeux de données massifs non structurés (NLP)\nEntraînement de modèles de classification de texte thématiques'}
      ],
      education: [{degree:'Master Sciences de l\'Intelligence Artificielle', school:'ENSEEIHT', year:'2023'}, {degree:'Licence Mathématiques & Informatique', school:'Université Paul Sabatier', year:'2021'}]
    },
    portfolio: {
      name: 'Sophie Alami', title: 'Ingénieure Intelligence Artificielle & Data', email: 'sophie.alami@example.ai', github: 'github.com/sophie-alami-ds', linkedin: 'linkedin.com/in/sophiealami',
      bio: "Développeuse d'architectures prédictives et passionnée par l'IA souveraine. Je transforme la donnée brute en briques intelligentes exploitables.",
      skills: ['Python', 'PyTorch', 'SQL', 'LLM locaux', 'RAG', 'Docker', 'Linux', 'Analyse de données'],
      projects: [
        {title:'Moteur RAG Souverain', category:'dev', description:'Mise en place d\'une architecture d\'extraction et indexation de données documentaires offline.', tech:'Python, LangChain, ChromaDB', link:'#'},
        {title:'Pipeline Big Data Spark', category:'dev', description:'Traitement de flux de logs réseau en temps réel pour l\'analyse de comportements anormaux.', tech:'Apache Spark, Kafka', link:'#'}
      ]
    }
  }
];

// Sélectionner un profil au hasard au chargement
const randomProfile = mockProfiles[Math.floor(Math.random() * mockProfiles.length)];

/* ══════════════════════════════════════════════════
   STATE GLOBAL CONTROLEUR & CONFIGURATION
══════════════════════════════════════════════════ */
let mode = 'cv';
let cvTemplate = 'classic';
let portfolioTemplate = 'dark-cinematic';

const cv = JSON.parse(JSON.stringify(randomProfile.cv));
const portfolio = JSON.parse(JSON.stringify(randomProfile.portfolio));

// Options d'interopérabilité demandées (customisation dynamique directe par le site)
let customDesign = {
  accentColor: '#2d8cf0',
  fontFamily: 'outfit-syne', // outfit-syne, playfair, montserrat, bebas-roboto
  showInterests: true,
  showSoftSkills: true,
  customLayoutOrder: 'normal' // normal ou inverse (cross-model structural modification)
};

/* ══════════════════════════════════════════════════
   FORM RENDERING & ACCORDIONS
══════════════════════════════════════════════════ */
function sec(icon, title, id, content) {
  return `<div class="section open" id="sec-${id}">
    <div class="section-head" onclick="toggleSec('${id}')">
      <div class="section-title"><span class="section-icon">${icon}</span>${title}</div>
      <span class="section-arrow">▾</span>
    </div>
    <div class="section-body">${content}</div>
  </div>`;
}

function field(label, inputHtml) {
  return `<div class="field"><label>${label}</label>${inputHtml}</div>`;
}
function inp(key, ph, obj='cv') {
  return `<input type="text" placeholder="${ph}" value="${esc((obj==='cv'?cv:portfolio)[key]||'')}" oninput="${obj}['${key}']=this.value;updatePreview()">`;
}
function ta(key, ph, obj='cv') {
  return `<textarea placeholder="${ph}" oninput="${obj}['${key}']=this.value;updatePreview()">${esc((obj==='cv'?cv:portfolio)[key]||'')}</textarea>`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderSkillRows(arr, arrKey, addFn, obj='cv') {
  return arr.map((s,i)=>`
    <div class="skill-row">
      <input type="text" class="field input" placeholder="Compétence" value="${esc(s.name)}"
        oninput="${obj}['${arrKey}'][${i}].name=this.value;updatePreview()">
      <input type="number" class="skill-level" min="0" max="100" value="${s.level}"
        oninput="${obj}['${arrKey}'][${i}].level=+this.value;updatePreview()">
      <button class="btn-rm" onclick="${obj}['${arrKey}'].splice(${i},1);renderForm();updatePreview()">✕</button>
    </div>`).join('')
  + `<button class="btn-add" onclick="${addFn};renderForm();updatePreview()">+ Ajouter</button>`;
}

function renderTagsInput(arrKey, obj='cv') {
  const arr = (obj==='cv'?cv:portfolio)[arrKey];
  const tags = arr.map((t,i)=>
    `<span class="tag">${esc(t)}<span class="tag-x" onclick="rmTag('${arrKey}',${i},'${obj}')">✕</span></span>`
  ).join('');
  return `<div class="tags-wrap" onclick="this.querySelector('.tags-input').focus()">
    ${tags}
    <input class="tags-input" type="text" placeholder="Ajouter…" onkeydown="addTag(event,'${arrKey}','${obj}')">
  </div><div class="tags-hint">Entrée ou virgule pour insérer</div>`;
}

function renderExpItems() {
  return cv.experiences.map((e,i)=>`
    <div class="dyn-item">
      <div class="dyn-item-head">
        <span class="dyn-item-label">Expérience ${i+1}</span>
        <button class="btn-rm" onclick="cv.experiences.splice(${i},1);renderForm();updatePreview()">✕</button>
      </div>
      ${field('Poste',`<input type="text" value="${esc(e.title)}" oninput="cv.experiences[${i}].title=this.value;updatePreview()">`)}
      ${field('Structure',`<input type="text" value="${esc(e.company)}" oninput="cv.experiences[${i}].company=this.value;updatePreview()">`)}
      ${field('Dates / Période',`<input type="text" value="${esc(e.date)}" oninput="cv.experiences[${i}].date=this.value;updatePreview()">`)}
      ${field('Missions (1 par ligne)',`<textarea oninput="cv.experiences[${i}].bullets=this.value;updatePreview()">${esc(e.bullets)}</textarea>`)}
    </div>`).join('')
  + `<button class="btn-add" onclick="cv.experiences.push({title:'',company:'',date:'',bullets:''});renderForm();updatePreview()">+ Ajouter</button>`;
}

function renderEduItems() {
  return cv.education.map((e,i)=>`
    <div class="dyn-item">
      <div class="dyn-item-head">
        <span class="dyn-item-label">Cursus ${i+1}</span>
        <button class="btn-rm" onclick="cv.education.splice(${i},1);renderForm();updatePreview()">✕</button>
      </div>
      ${field('Diplôme obtenu',`<input type="text" value="${esc(e.degree)}" oninput="cv.education[${i}].degree=this.value;updatePreview()">`)}
      <div class="field-row">
        ${field('Établissement',`<input type="text" value="${esc(e.school)}" oninput="cv.education[${i}].school=this.value;updatePreview()">`)}
        ${field('Année',`<input type="text" value="${esc(e.year)}" oninput="cv.education[${i}].year=this.value;updatePreview()">`)}
      </div>
    </div>`).join('')
  + `<button class="btn-add" onclick="cv.education.push({degree:'',school:'',year:''});renderForm();updatePreview()">+ Ajouter</button>`;
}

function renderLangItems() {
  return cv.languages.map((l,i)=>`
    <div class="field-row" style="margin-bottom:.35rem">
      <input type="text" placeholder="Langue" value="${esc(l.name)}" oninput="cv.languages[${i}].name=this.value;updatePreview()">
      <input type="text" placeholder="Niveau" value="${esc(l.level)}" oninput="cv.languages[${i}].level=this.value;updatePreview()">
      <button class="btn-rm" onclick="cv.languages.splice(${i},1);renderForm();updatePreview()" style="width:26px;height:auto">✕</button>
    </div>`).join('')
  + `<button class="btn-add" onclick="cv.languages.push({name:'',level:''});renderForm();updatePreview()">+ Ajouter</button>`;
}

function renderProjectItems() {
  return portfolio.projects.map((p,i)=>`
    <div class="dyn-item">
      <div class="dyn-item-head">
        <span class="dyn-item-label">Projet ${i+1}</span>
        <button class="btn-rm" onclick="portfolio.projects.splice(${i},1);renderForm();updatePreview()">✕</button>
      </div>
      ${field('Nom du projet',`<input type="text" value="${esc(p.title)}" oninput="portfolio.projects[${i}].title=this.value;updatePreview()">`)}
      <div class="field-row">
        ${field('Catégorie',`<input type="text" value="${esc(p.category)}" placeholder="dev / video / design" oninput="portfolio.projects[${i}].category=this.value;updatePreview()">`)}

function addTag(e, key, obj='cv') {
  if(e.key==='Enter'||e.key===',') {
    e.preventDefault();
    const v = e.target.value.trim().replace(/,$/,'');
    if(v){(obj==='cv'?cv:portfolio)[key].push(v); e.target.value=''; renderForm(); updatePreview();}
  }
}
function rmTag(key, i, obj='cv') {
  (obj==='cv'?cv:portfolio)[key].splice(i,1); renderForm(); updatePreview();
}
function toggleSec(id) {
  document.getElementById('sec-'+id).classList.toggle('open');
}

/* ══════════════════════════════════════════════════
   GÉRER LES POLICES ET STYLES DE BASE INJECTÉS
══════════════════════════════════════════════════ */
function getCustomFontCSS() {
  switch(customDesign.fontFamily) {
    case 'playfair': return "body, html { font-family: 'Outfit', sans-serif; } h1, h2, h3, .title-font { font-family: 'Playfair Display', serif; }";
    case 'montserrat': return "body, html, h1, h2, h3 { font-family: 'Montserrat', sans-serif; }";
    case 'bebas-roboto': return "body, html { font-family: 'Roboto', sans-serif; } h1, h2, h3, .title-font { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }";
    default: return "body, html { font-family: 'Outfit', sans-serif; } h1, h2, h3, .title-font { font-family: 'Syne', sans-serif; }";
  }
}

/* ══════════════════════════════════════════════════
   MODE & NAVIGATION DES TEMPLATES
══════════════════════════════════════════════════ */
function setMode(m) {
  mode = m;
  document.getElementById('btn-cv').classList.toggle('active', m==='cv');
  document.getElementById('btn-portfolio').classList.toggle('active', m==='portfolio');
  
  const sel = document.getElementById('template-sel');
  if(m==='cv'){
    sel.innerHTML=`
      <option value="classic">Classic</option>
      <option value="light-pro">Light Pro</option>
      <option value="creative-emerald">Creative Emerald</option>
      <option value="editorial-serif">Editorial Serif</option>
    `;
    sel.value = cvTemplate;
  } else {
    sel.innerHTML=`
      <option value="dark-cinematic">Dark Cinematic</option>
      <option value="minimal">Minimal</option>
      <option value="masonry-visual">Masonry Visual</option>
      <option value="adobe-sidebar">Adobe Left-Sidebar</option>
    `;
    sel.value = portfolioTemplate;
  }
  renderForm();
  updatePreview();
}

function updateTemplate() {
  const v = document.getElementById('template-sel').value;
  if(mode==='cv') cvTemplate=v; else portfolioTemplate=v;
  updatePreview();
}

let previewTimer = null;
function updatePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(_doPreview, 100);
}

function _doPreview() {
  const iframe = document.getElementById('preview');
  const html = mode==='cv' ? renderCVTemplate() : renderPortfolioTemplate();
  if (mode==='cv') {
    iframe.style.width='210mm'; iframe.style.height='297mm';
    document.getElementById('preview-size').textContent='Format A4 strict (Impression PDF)';
  } else {
    iframe.style.width='950px'; iframe.style.height='620px';
    document.getElementById('preview-size').textContent='Rendu Écran Web Élastique';
  }
  iframe.srcdoc = html;
}

function exportHTML() {
  const html = mode==='cv' ? renderCVTemplate() : renderPortfolioTemplate();
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = mode==='cv' ? 'cv_export.html' : 'portfolio_export.html';
  a.click();
}

function exportPDF() {
  const html = mode==='cv' ? renderCVTemplate() : renderPortfolioTemplate();
  const win = window.open('','_blank');
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(()=>{ win.print(); }, 750);
}

  switch(cvTemplate) {

    default: return renderCVClassic();
  }
}

function renderPortfolioTemplate() {
  switch(portfolioTemplate) {
    case 'minimal': return renderPortfolioMinimal();

  return `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<style>
${getCustomFontCSS()}
:root{--bg:#080c10;--bg2:#0d1117;--accent:${accent};--white:#e8edf2;--muted:#7d8590;}
body{background:var(--bg); color:var(--white); margin:0; padding:2rem; font-weight:300;}
nav{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:1rem;}
.hero{padding:4rem 0; max-width:800px;}
.hero-name{font-size:32pt; font-weight:800; margin:0; color:${accent};}
.cat-btn{background:transparent; border:1px solid rgba(255,255,255,0.1); color:var(--muted); padding:1.5mm 4mm; border-radius:4px; cursor:pointer; margin-right:2mm; text-transform:uppercase; font-size:7.5pt;}
.cat-btn:hover{border-color:${accent}; color:#fff;}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:1rem; margin-top:2rem;}
.card{background:var(--bg2); border:1px solid rgba(255,255,255,0.05); padding:1.5rem; border-radius:8px;}
</style></head>
<body>
  <nav><div style="font-weight:800;" class="title-font">${portfolio.name}</div></nav>
  <div class="hero">
    <h1 class="hero-name title-font">${portfolio.name}</h1>
    <p style="font-size:14px; color:var(--muted);">${portfolio.title}</p>
    <p style="color:#a8bdd1; font-size:15px;">${portfolio.bio}</p>
  </div>
  <div><div style="font-size:8pt; font-weight:700; text-transform:uppercase; color:${accent}; margin-bottom:10px;">Filtres de Galerie</div>${catBtns}</div>
  <div class="grid">${portfolio.projects.map(p=>`<div class="card" data-cat="${p.category}"><div style="font-size:7pt; color:${accent}; text-transform:uppercase;">${p.category}</div><h3 style="margin:5px 0;" class="title-font">${p.title}</h3><p style="font-size:12px; color:var(--muted);">${p.description}</p></div>`).join('')}</div>

      document.querySelectorAll('.card').forEach(card => {
        card.style.display = (c === 'all' || card.dataset.cat === c) ? 'block' : 'none';
      });
    }
  <\/script>
</body></html>`;
}
